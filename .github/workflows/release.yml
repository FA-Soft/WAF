# Release builds: the self-contained packages for Windows (win-x64), the Raspberry Pi (linux-arm64) and Linux x64,
# each started once on a machine without .NET (smoke test), and attached to a GitHub release.
#
#   git tag v1.2.0 && git push origin v1.2.0      builds, tests and publishes the release "v1.2.0"
#   Actions > Release > Run workflow              builds and tests only; the packages are kept as workflow artifacts
#
# A tag with a hyphen (v1.2.0-rc.1) becomes a pre-release.
#
# Code signing (Windows): WafGateway.exe, wafctl.exe and Install.ps1 are signed with Azure Artifact Signing (formerly
# Trusted Signing): Authenticode, SHA-256, timestamped. The workflow signs in to Azure with OpenID Connect, so no Azure
# secret is stored in GitHub. It is switched on by these repository variables (Settings > Secrets and variables >
# Actions > Variables); without them the packages are built unsigned, with a warning. See docs/code-signing.md.
#   AZURE_TENANT_ID, AZURE_CLIENT_ID                    the app registration that may sign (federated credential for this repository)
#   ARTIFACT_SIGNING_ENDPOINT                            for example https://weu.codesigning.azure.net/
#   ARTIFACT_SIGNING_ACCOUNT, ARTIFACT_SIGNING_PROFILE   the signing account and its certificate profile
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number for a test build (for example 1.2.0-rc.1); empty: 0.0.0-dev.<run number>'
        required: false
        default: ''

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
  CONFIGURATION: Release

jobs:
  package:
    name: Package (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    # The Azure app registration trusts this environment (one fixed OpenID Connect subject for every tag); it can also
    # require an approval before a release is built and signed.
    environment: release
    permissions:
      contents: read
      id-token: write # OpenID Connect token for signing in to Azure (code signing)
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            # Always GitHub-hosted (not the self-hosted runner of ci.yml): the smoke test hides the machine's .NET.
            os: windows-latest
            file: WafGateway-win-x64.zip
          - rid: linux-arm64
            os: ubuntu-latest
            platform: linux/arm64
            file: wafgateway-linux-arm64.tar.gz
          - rid: linux-x64
            os: ubuntu-latest
            platform: linux/amd64
            file: wafgateway-linux-x64.tar.gz

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-publish-${{ matrix.rid }}-${{ hashFiles('global.json', '**/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-publish-${{ matrix.rid }}-

      - name: Version
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="${INPUT_VERSION:-0.0.0-dev.$RUN_NUMBER}"
          fi
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] \
            || { echo "::error::Not a version number: $version (expected for example 1.2.0 or 1.2.0-rc.1)"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version $version"

      - name: Build the package (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: .\deploy\windows\Build-Package.ps1 -Configuration $env:CONFIGURATION -Version '${{ steps.version.outputs.version }}'

      # Code signing (Windows): switched on by the repository variables described at the top.
      - name: Signing settings (Windows)
        if: runner.os == 'Windows'
        id: signing
        shell: bash
        env:
          TENANT: ${{ vars.AZURE_TENANT_ID }}
          CLIENT: ${{ vars.AZURE_CLIENT_ID }}
          ENDPOINT: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          ACCOUNT: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          PROFILE: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
        run: |
          if [[ -n "$TENANT" && -n "$CLIENT" && -n "$ENDPOINT" && -n "$ACCOUNT" && -n "$PROFILE" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Code signing: on (account $ACCOUNT, profile $PROFILE)"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::The Windows package is NOT signed: set the code-signing variables (see docs/code-signing.md)."
          fi

      - name: Sign in to Azure (OpenID Connect)
        if: steps.signing.outputs.enabled == 'true'
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Sign the programs and the installer script
        if: steps.signing.outputs.enabled == 'true'
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
          files: |
            ${{ github.workspace }}\artifacts\windows\WafGateway-win-x64\WafGateway.exe
            ${{ github.workspace }}\artifacts\windows\WafGateway-win-x64\wafctl.exe
            ${{ github.workspace }}\artifacts\windows\WafGateway-win-x64\Install.ps1
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: WAF Gateway
          description-url: ${{ github.server_url }}/${{ github.repository }}
          # Only the Azure CLI sign-in of the step above.
          exclude-environment-credential: true
          exclude-workload-identity-credential: true
          exclude-managed-identity-credential: true

      # A signature that is missing or not valid stops the release; the zip is made again with the signed files.
      - name: Check the signatures and zip the signed package
        if: steps.signing.outputs.enabled == 'true'
        shell: powershell
        run: |
          $package = 'artifacts\windows\WafGateway-win-x64'
          foreach ($file in 'WafGateway.exe', 'wafctl.exe', 'Install.ps1') {
              $signature = Get-AuthenticodeSignature -LiteralPath (Join-Path $package $file)
              if ($signature.Status -ne 'Valid' -or -not $signature.TimeStamperCertificate) {
                  throw "$file is not validly signed and timestamped: $($signature.Status) $($signature.StatusMessage)"
              }
              Write-Host "$file signed by $($signature.SignerCertificate.Subject), timestamped $($signature.TimeStamperCertificate.NotBefore)"
          }
          .\deploy\windows\Build-Package.ps1 -ZipOnly

      - name: Build the package (Linux)
        if: runner.os == 'Linux'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: bash deploy/linux/build-package.sh ${{ matrix.rid }}

      # Acceptance: the release runs without an installed .NET runtime. The .NET SDK of this runner is hidden.
      - name: Smoke test without .NET (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: .\deploy\windows\Smoke-Test.ps1 -Package artifacts\windows\WafGateway-win-x64 -HideDotNet

      - name: Set up QEMU (arm64 containers)
        if: matrix.rid == 'linux-arm64'
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      # A plain Ubuntu Server userland (as on a Raspberry Pi), with only the system libraries .NET uses, no .NET.
      - name: Smoke test without .NET (Ubuntu 24.04 container, ${{ matrix.platform }})
        if: runner.os == 'Linux'
        run: |
          docker run --rm --platform ${{ matrix.platform }} -v "$PWD:/work:ro" -w /work -e SMOKE_TIMEOUT=600 ubuntu:24.04 bash -c '
            apt-get update -qq && apt-get install -y -qq --no-install-recommends curl ca-certificates libicu74 libssl3t64 >/dev/null
            bash deploy/linux/smoke-test.sh artifacts/linux/wafgateway-${{ matrix.rid }}'

      - name: Upload the package
        uses: actions/upload-artifact@v7
        with:
          name: package-${{ matrix.rid }}
          path: artifacts/*/${{ matrix.file }}
          if-no-files-found: error
          retention-days: 30

  release:
    name: GitHub release
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download the packages
        uses: actions/download-artifact@v8
        with:
          pattern: package-*
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          cd dist
          find . -type f -name '*.zip' -o -type f -name '*.tar.gz' | xargs -I{} mv {} .
          find . -mindepth 1 -type d -exec rm -rf {} +
          sha256sum -- *.zip *.tar.gz > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=()
          [[ "$GITHUB_REF_NAME" != *-* ]] || prerelease=(--prerelease)
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "WAF Gateway ${GITHUB_REF_NAME#v}" --generate-notes "${prerelease[@]}"

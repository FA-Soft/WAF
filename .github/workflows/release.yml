# Release builds: the self-contained packages for Windows (win-x64), the Raspberry Pi (linux-arm64) and Linux x64,
# each started once on a machine without .NET (smoke test), and attached to a GitHub release.
#
#   git tag v1.2.0 && git push origin v1.2.0      builds, tests and publishes the release "v1.2.0"
#   Actions > Release > Run workflow              builds and tests only; the packages are kept as workflow artifacts
#
# A tag with a hyphen (v1.2.0-rc.1) becomes a pre-release.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number for a test build (for example 1.2.0-rc.1); empty: 0.0.0-dev.<run number>'
        required: false
        default: ''

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
  CONFIGURATION: Release

jobs:
  package:
    name: Package (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
            file: WafGateway-win-x64.zip
          - rid: linux-arm64
            os: ubuntu-latest
            platform: linux/arm64
            file: wafgateway-linux-arm64.tar.gz
          - rid: linux-x64
            os: ubuntu-latest
            platform: linux/amd64
            file: wafgateway-linux-x64.tar.gz

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-publish-${{ matrix.rid }}-${{ hashFiles('global.json', '**/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-publish-${{ matrix.rid }}-

      - name: Version
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="${INPUT_VERSION:-0.0.0-dev.$RUN_NUMBER}"
          fi
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] \
            || { echo "::error::Not a version number: $version (expected for example 1.2.0 or 1.2.0-rc.1)"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version $version"

      - name: Build the package (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: .\deploy\windows\Build-Package.ps1 -Configuration $env:CONFIGURATION -Version '${{ steps.version.outputs.version }}'

      - name: Build the package (Linux)
        if: runner.os == 'Linux'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: bash deploy/linux/build-package.sh ${{ matrix.rid }}

      # Acceptance: the release runs without an installed .NET runtime. The .NET SDK of this runner is hidden.
      - name: Smoke test without .NET (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: .\deploy\windows\Smoke-Test.ps1 -Package artifacts\windows\WafGateway-win-x64 -HideDotNet

      - name: Set up QEMU (arm64 containers)
        if: matrix.rid == 'linux-arm64'
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      # A plain Ubuntu Server userland (as on a Raspberry Pi), with only the system libraries .NET uses, no .NET.
      - name: Smoke test without .NET (Ubuntu 24.04 container, ${{ matrix.platform }})
        if: runner.os == 'Linux'
        run: |
          docker run --rm --platform ${{ matrix.platform }} -v "$PWD:/work:ro" -w /work -e SMOKE_TIMEOUT=600 ubuntu:24.04 bash -c '
            apt-get update -qq && apt-get install -y -qq --no-install-recommends curl ca-certificates libicu74 libssl3t64 >/dev/null
            bash deploy/linux/smoke-test.sh artifacts/linux/wafgateway-${{ matrix.rid }}'

      - name: Upload the package
        uses: actions/upload-artifact@v7
        with:
          name: package-${{ matrix.rid }}
          path: artifacts/*/${{ matrix.file }}
          if-no-files-found: error
          retention-days: 30

  release:
    name: GitHub release
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download the packages
        uses: actions/download-artifact@v8
        with:
          pattern: package-*
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          cd dist
          find . -type f -name '*.zip' -o -type f -name '*.tar.gz' | xargs -I{} mv {} .
          find . -mindepth 1 -type d -exec rm -rf {} +
          sha256sum -- *.zip *.tar.gz > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=()
          [[ "$GITHUB_REF_NAME" != *-* ]] || prerelease=(--prerelease)
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "WAF Gateway ${GITHUB_REF_NAME#v}" --generate-notes "${prerelease[@]}"

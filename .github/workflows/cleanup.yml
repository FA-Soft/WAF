name: Cleanup GitHub Actions Storage

on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Cleanup artifacts and caches older than 1 days
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          echo "=== CLEANUP STARTED ==="

          ARTIFACT_CUTOFF=$(date -u -d "1 days ago" +"%Y-%m-%dT%H:%M:%SZ")

          echo "Deleting artifacts older than 1 days..."

          gh api \
            "/repos/$REPO/actions/artifacts?per_page=100" \
            --paginate \
            --jq '.artifacts[] | "\(.id) \(.created_at)"' |
          while read -r ID CREATED; do
            if [[ "$CREATED" < "$ARTIFACT_CUTOFF" ]]; then
              echo "Deleting artifact $ID ($CREATED)"

              gh api \
                --method DELETE \
                "/repos/$REPO/actions/artifacts/$ID" \
                || true
            fi
          done

          CACHE_CUTOFF=$(date -d "1 days ago" +%s)

          echo "Deleting caches older than 1 days..."

          gh api \
            "/repos/$REPO/actions/caches?per_page=100" \
            --paginate \
            --jq '.actions_caches[] | "\(.id) \(.created_at)"' |
          while read -r ID CREATED; do

            CREATED_TS=$(date -d "$CREATED" +%s)

            if [ "$CREATED_TS" -lt "$CACHE_CUTOFF" ]; then
              echo "Deleting cache $ID ($CREATED)"

              gh api \
                --method DELETE \
                "/repos/$REPO/actions/caches/$ID" \
                || true
            fi
          done

          echo "=== CLEANUP COMPLETED ==="
